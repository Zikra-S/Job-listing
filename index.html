<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/images/favicon-32x32.png" />
    <title>Job Listings with Filtering</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700&display=swap" rel="stylesheet" />

    <style>
      body {
        font-family: "League Spartan", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[hsl(180,52%,96%)] min-h-screen text-[15px] antialiased">
    <header
      class="bg-[hsl(180,29%,50%)] bg-[url('./src/assets/images/bg-header-mobile.svg')] md:bg-[url('./src/assets/images/bg-header-desktop.svg')] bg-center h-[100px] w-full"></header>

    <main class="max-w-[1110px] mx-auto px-6 pb-20">
      <section
        id="filter-bar"
        class="hidden bg-white rounded-md shadow-[0_15px_20px_rgba(91,164,164,0.15)] p-5 md:px-10 -mt-9 mb-10 flex items-center justify-between gap-4 min-h-[72px] transition-all">
        <div id="filter-pills" class="flex flex-wrap gap-4 items-center"></div>
        <button
          id="clear-btn"
          type="button"
          class="text-[hsl(180,8%,52%)] hover:text-[hsl(180,29%,50%)] hover:underline font-bold text-sm cursor-pointer ml-auto">
          Clear
        </button>
      </section>

      <section id="job-list" class="space-y-10 md:space-y-6 pt-12 md:pt-16"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
